<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alibook | کتاب‌های کلاس ششم</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Tahoma, Arial, sans-serif;
    }

    body {
      background: #f4f7fb;
      color: #222;
    }

    header {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: white;
      text-align: center;
      padding: 40px 15px;
    }

    header h1 {
      font-size: 40px;
      margin-bottom: 10px;
    }

    header p {
      font-size: 18px;
    }

    .container {
      width: 90%;
      max-width: 1100px;
      margin: 40px auto;
    }

    .title {
      text-align: center;
      font-size: 28px;
      margin-bottom: 30px;
    }

    .books {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 22px;
    }

    .book {
      background: white;
      border-radius: 20px;
      padding: 28px 20px;
      text-align: center;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
      transition: .25s;
    }

    .book:hover {
      transform: translateY(-7px);
    }

    .icon {
      font-size: 55px;
      margin-bottom: 15px;
    }

    .book h2 {
      font-size: 21px;
      margin-bottom: 18px;
    }

    .book button {
      border: none;
      background: #4f46e5;
      color: white;
      padding: 11px 22px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 15px;
    }

    .book button:hover {
      background: #3730a3;
    }

    footer {
      margin-top: 50px;
      padding: 25px;
      background: #111827;
      color: white;
      text-align: center;
    }
  </style>
</head>

<body>

  <header>
    <h1>📚 Alibook</h1>
    <p>کتابخانه دیجیتال کلاس ششم</p>
  </header>

  <main class="container">

    <h2 class="title">📚 کتاب‌های کلاس ششم</h2>

    <div class="books">

      <div class="book">
        <div class="icon">🔢</div>
        <h2>ریاضی</h2>
        <button>باز کردن کتاب</button>
      </div>

      <div class="book">
        <div class="icon">📖</div>
        <h2>فارسی</h2>
        <button>باز کردن کتاب</button>
      </div>

      <div class="book">
        <div class="icon">✏️</div>
        <h2>نگارش</h2>
        <button>باز کردن کتاب</button>
      </div>

      <div class="book">
        <div class="icon">🌍</div>
        <h2>مطالعات اجتماعی</h2>
        <button>باز کردن کتاب</button>
      </div>

      <div class="book">
        <div class="icon">🔬</div>
        <h2>علوم</h2>
        <button>باز کردن کتاب</button>
      </div>

      <div class="book">
        <div class="icon">💻</div>
        <h2>کار و فناوری</h2>
        <button>باز کردن کتاب</button>
      </div>

      <div class="book">
        <div class="icon">📕</div>
        <h2>قرآن</h2>
        <button>باز کردن کتاب</button>
      </div>

      <div class="book">
        <div class="icon">🌙</div>
        <h2>هدیه‌های آسمان</h2>
        <button>باز کردن کتاب</button>
      </div>

      <div class="book">
        <div class="icon">💡</div>
        <h2>تفکر و پژوهش</h2>
        <button>باز کردن کتاب</button>
      </div>

    </div>
  </main>

  <footer>
    © 2026 Alibook | کتابخانه کلاس ششم
  </footer>

</body>
</html>
